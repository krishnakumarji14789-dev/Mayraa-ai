<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAYRAA AI</title>
<style>
:root{--p:#9b5cff;--b:#38b6ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(circle at 50% 15%,#2a0f6b,#07041a 70%);color:#e9e4ff;font-family:system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),24px) 14px max(env(safe-area-inset-bottom),12px)}
header{display:flex;justify-content:space-between;align-items:center;gap:6px}
h1{font-size:19px;letter-spacing:6px;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:#ffffff14;border:1px solid #ffffff2a;color:#fff;border-radius:12px;padding:8px 11px;font-size:13px}
.ib.on{background:linear-gradient(90deg,var(--p),var(--b));box-shadow:0 0 16px var(--p)}
#stage{height:220px;perspective:700px;display:flex;align-items:center;justify-content:center;flex:none}
#orb{position:relative;width:140px;height:140px;transform-style:preserve-3d;animation:spin 12s linear infinite}
#core{position:absolute;inset:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3d2ff,var(--p) 40%,#18278a 90%);box-shadow:0 0 50px var(--p),0 0 110px #38b6ff66;animation:pulse 3s ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--b);box-shadow:0 0 14px var(--b),inset 0 0 14px var(--p)}
.r1{transform:rotateX(72deg)}.r2{transform:rotateY(72deg);border-color:var(--p)}.r3{transform:rotateX(45deg) rotateY(45deg)}
@keyframes spin{from{transform:rotateX(18deg) rotateY(0)}to{transform:rotateX(18deg) rotateY(360deg)}}
@keyframes pulse{50%{transform:scale(1.1)}}
.listening #core{animation-duration:.7s;box-shadow:0 0 60px var(--b),0 0 120px var(--b)}
.speaking #core{animation-duration:.45s}
.thinking #orb{animation-duration:3s}
#status{text-align:center;font-size:13px;opacity:.75;margin-bottom:6px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.b{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.u{align-self:flex-end;background:linear-gradient(135deg,#5b2fd6,#2b6fe0)}
.m{align-self:flex-start;background:#ffffff14;border:1px solid #9b5cff55}
#mic{margin:10px auto 0;width:74px;height:74px;border-radius:50%;border:none;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 0 30px var(--p)}
#set{position:fixed;inset:0;background:#07041af2;display:none;padding:24px 16px;overflow:auto}
#set label{display:block;margin:14px 0 4px;font-size:13px;opacity:.8}
#set input,#set textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #9b5cff88;background:#150a3a;color:#fff;font-size:15px}
</style></head>
<body><div id="app">
<header><h1>MAYRAA</h1><div>
<button class="ib" id="lang">EN</button>
<button class="ib" id="wk">Wake: OFF</button>
<button class="ib" id="gear">⚙</button></div></header>
<div id="stage" class="idle"><div id="orb"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div id="core"></div></div></div>
<div id="status">Tap the mic</div>
<div id="log"></div>
<button id="mic">🎤</button>
<div id="set">
<h1>Settings</h1>
<label>Groq API key</label><input id="k" type="password" placeholder="gsk_...">
<label>Default city for weather</label><input id="c" placeholder="Delhi">
<label>Contacts (one per line: name=number)</label><textarea id="ct" rows="5" placeholder="mom=9876543210"></textarea>
<button class="ib on" id="sv" style="margin-top:18px;width:100%;padding:12px">Save</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const P=()=>(window.Capacitor&&Capacitor.Plugins)||{};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cfg=Object.assign({key:'',city:'Delhi',contacts:'',lang:'en-IN'},JSON.parse(localStorage.getItem('mayraa')||'{}'));
const save=()=>localStorage.setItem('mayraa',JSON.stringify(cfg));
let busy=false,wake=false,history=[];
const DEV=/[\u0900-\u097F]/;

function add(t,c){const d=document.createElement('div');d.className='b '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
function state(s){$('stage').className=s;$('status').textContent={idle:wake?'Say "Hey MAYRAA"':'Tap the mic',listening:'Listening…',thinking:'Thinking…',speaking:'Speaking…'}[s]}

async function speak(t){
  add(t,'m');state('speaking');
  try{await P().TextToSpeech.speak({text:t,lang:DEV.test(t)?'hi-IN':'en-IN',rate:1,pitch:1.1,volume:1})}catch(e){}
  state('idle');
}
async function listen(lang){
  const SR=P().SpeechRecognition;
  if(!SR){add('Speech plugin missing','m');return ''}
  try{
    const a=await SR.available();
    if(!a.available){add('Speech recognition unavailable. Update the Google app.','m');return ''}
    let p=await SR.checkPermissions();
    if(p.speechRecognition!=='granted'){p=await SR.requestPermissions();if(p.speechRecognition!=='granted'){add('Microphone permission is needed.','m');return ''}}
    state('listening');
    const r=await SR.start({language:lang,maxResults:1,prompt:'',partialResults:false,popup:false});
    return (r.matches&&r.matches[0])||'';
  }catch(e){return ''}
}

const APPS=[
[/whatsapp|व्हाट्सएप|वॉट्सऐप/i,'com.whatsapp','WhatsApp'],
[/youtube|यूट्यूब/i,'com.google.android.youtube','YouTube'],
[/chrome|क्रोम/i,'com.android.chrome','Chrome'],
[/instagram|इंस्टाग्राम/i,'com.instagram.android','Instagram'],
[/facebook|फेसबुक/i,'com.facebook.katana','Facebook'],
[/gmail|जीमेल/i,'com.google.android.gm','Gmail'],
[/maps|मैप/i,'com.google.android.apps.maps','Maps'],
[/play store|प्ले स्टोर/i,'com.android.vending','Play Store'],
[/settings|सेटिंग/i,'com.android.settings','Settings'],
[/camera|कैमरा/i,'com.motorola.camera3','Camera'],
[/messages|message|मैसेज/i,'com.google.android.apps.messaging','Messages'],
[/phone|dialer|फोन/i,'com.google.android.dialer','Phone'],
[/telegram|टेलीग्राम/i,'org.telegram.messenger','Telegram'],
[/spotify|स्पॉटिफाई/i,'com.spotify.music','Spotify'],
[/calculator|कैलकुलेटर/i,'com.google.android.calculator','Calculator'],
[/clock|alarm|घड़ी/i,'com.google.android.deskclock','Clock'],
[/photos|gallery|गैलरी|फोटो/i,'com.google.android.apps.photos','Photos'],
[/contacts|कॉन्टैक्ट/i,'com.google.android.contacts','Contacts']];

const WC=[[0,'clear sky','साफ़ आसमान'],[3,'partly cloudy','बादल छाए हैं'],[48,'foggy','कोहरा'],[57,'drizzle','बूंदाबांदी'],[67,'rain','बारिश'],[77,'snow','बर्फ़बारी'],[82,'rain showers','बौछारें'],[99,'thunderstorm','आंधी-तूफ़ान']];

async function doCall(t){
  let n=t.replace(/\b(please|call|dial|phone|to|ko|karo|kar|do)\b|कॉल|फोन|फ़ोन|को|करो|कर|दो|लगाओ|मिलाओ|मुझे/gi,' ').trim();
  let num=n.replace(/\D/g,'');
  if(num.length<6){
    const line=cfg.contacts.split('\n').find(l=>l.split('=')[0].trim().toLowerCase()===n.toLowerCase());
    num=line?line.split('=')[1].replace(/\D/g,''):'';
  }
  if(!num){return speak(DEV.test(t)?'मुझे यह नंबर नहीं मिला। सेटिंग्स में संपर्क जोड़ें।':'I could not find that contact. Add it in Settings as name=number.')}
  await speak((DEV.test(t)?'क्या मैं '+n+' को कॉल करूँ? हाँ या ना बोलिए।':'Should I call '+n+'? Say yes or no.'));
  const a=await listen(cfg.lang);
  if(/\b(yes|yeah|yep|ok|okay|sure|haan|han)\b|हाँ|हां|जी|कर दो/i.test(a)){
    await speak(DEV.test(t)?'ठीक है, डायलर खोल रही हूँ।':'Okay, opening the dialer.');
    await P().AppLauncher.openUrl({url:'tel:'+num});
  }else await speak(DEV.test(t)?'कॉल रद्द कर दी।':'Call cancelled.');
}
async function doOpen(t){
  const app=APPS.find(a=>a[0].test(t));
  if(!app)return speak(DEV.test(t)?'मुझे यह ऐप नहीं मिला।':'I do not know that app yet.');
  try{
    const c=await P().AppLauncher.canOpenUrl({url:app[1]});
    if(!c.value)return speak(app[2]+(DEV.test(t)?' इंस्टॉल नहीं है।':' is not installed.'));
    await speak((DEV.test(t)?'खोल रही हूँ ':'Opening ')+app[2]);
    await P().AppLauncher.openUrl({url:app[1]});
  }catch(e){await speak('Could not open '+app[2])}
}
async function doWeather(t){
  let city=cfg.city;
  const m=t.match(/(?:in|of|at|for)\s+([a-z ]+?)(?:\s+today|\s*$)/i)||t.match(/([\u0900-\u097F]+)\s*(?:का|में)\s*(?:मौसम|तापमान)/);
  if(m)city=m[1].trim();
  const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(city))).json();
  if(!g.results)return speak(DEV.test(t)?'शहर नहीं मिला।':'I could not find that city.');
  const {latitude:la,longitude:lo,name}=g.results[0];
  const w=(await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code,wind_speed_10m`)).json()).current;
  const d=WC.find(x=>w.weather_code<=x[0])||WC[WC.length-1];
  const hi=DEV.test(t);
  await speak(hi?`${name} में अभी तापमान ${Math.round(w.temperature_2m)} डिग्री है, ${d[2]}, और हवा ${Math.round(w.wind_speed_10m)} किलोमीटर प्रति घंटा।`
               :`It is ${Math.round(w.temperature_2m)} degrees in ${name} right now, ${d[1]}, with wind at ${Math.round(w.wind_speed_10m)} kilometres per hour.`);
}
async function ask(user,ctx){
  if(!cfg.key)return 'Please add your Groq API key in Settings.';
  const sys='You are MAYRAA, a friendly female voice assistant. Reply in the same language as the user: Hindi in Devanagari script, or English. Keep answers to 1-3 short sentences suited for speech. No markdown, no emojis. Speak as a woman.'+(ctx?' Use these web notes to answer: '+ctx:'');
  history.push({role:'user',content:user});history=history.slice(-10);
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:sys},...history],temperature:.6,max_tokens:300})});
  if(!r.ok)throw new Error('AI error '+r.status);
  const a=(await r.json()).choices[0].message.content.trim();
  history.push({role:'assistant',content:a});return a;
}
async function doSearch(t){
  const q=t.replace(/\b(search|google|look up|for|about|on the internet|please)\b|सर्च|खोजो|ढूंढो|के बारे में|इंटरनेट पर/gi,' ').trim();
  const lg=DEV.test(t)?'hi':'en';
  let ctx='';
  try{
    const j=await (await fetch(`https://${lg}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exchars=500&format=json&origin=*`)).json();
    ctx=Object.values((j.query||{}).pages||{}).map(p=>p.title+': '+p.extract).join(' | ');
  }catch(e){}
  if(!cfg.key)return speak(ctx?ctx.slice(0,300):'I found nothing. Add your Groq key in Settings.');
  await speak(await ask(q,ctx||'none found'));
}
async function route(t){
  if(/\b(call|dial)\b|कॉल|फोन कर|फ़ोन कर/i.test(t))return doCall(t);
  if(/\b(open|launch)\b|खोलो|खोलें|चालू करो|शुरू करो/i.test(t))return doOpen(t);
  if(/weather|temperature|मौसम|तापमान/i.test(t))return doWeather(t);
  if(/\b(search|google|look up)\b|सर्च|खोजो|ढूंढो/i.test(t))return doSearch(t);
  await speak(await ask(t));
}
async function handle(t){
  if(!t){state('idle');return}
  busy=true;add(t,'u');state('thinking');
  try{await route(t)}catch(e){await speak('Sorry, something went wrong. '+e.message)}
  busy=false;state('idle');
}
const WAKE=/(hey|hi|hay|हे|हाय)\s*(mayra|maira|mayara|mayraa|myra|maaira|मायरा|मैरा)/i;
async function wakeLoop(){
  while(wake){
    if(busy){await sleep(500);continue}
    const t=await listen('en-IN');
    if(!wake)break;
    const m=t&&t.match(WAKE);
    if(m){
      let rest=t.slice(m.index+m[0].length).trim();
      if(rest.length<3){busy=true;await speak(cfg.lang==='hi-IN'?'जी, बोलिए':'Yes, I am listening');rest=await listen(cfg.lang);busy=false}
      await handle(rest);
    }else await sleep(300);
  }
  state('idle');
}
$('mic').onclick=async()=>{if(busy)return;busy=true;const t=await listen(cfg.lang);busy=false;await handle(t)};
$('wk').onclick=()=>{wake=!wake;$('wk').textContent='Wake: '+(wake?'ON':'OFF');$('wk').classList.toggle('on',wake);if(wake)wakeLoop();else state('idle')};
$('lang').onclick=()=>{cfg.lang=cfg.lang==='en-IN'?'hi-IN':'en-IN';$('lang').textContent=cfg.lang==='hi-IN'?'HI':'EN';save()};
$('gear').onclick=()=>{$('k').value=cfg.key;$('c').value=cfg.city;$('ct').value=cfg.contacts;$('set').style.display='block'};
$('sv').onclick=()=>{cfg.key=$('k').value.trim();cfg.city=$('c').value.trim()||'Delhi';cfg.contacts=$('ct').value;save();$('set').style.display='none'};
$('lang').textContent=cfg.lang==='hi-IN'?'HI':'EN';
add('Hi, I am MAYRAA. Open Settings (⚙) and add your Groq key first.','m');
</script></body></html>
